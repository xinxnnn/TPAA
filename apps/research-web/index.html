<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemAuth 学术复现工作台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172c3e;background:#f2f5f8}body{margin:0}header{background:#112e43;color:white;padding:28px 5vw}h1{font-size:26px;margin:0 0 12px}p{line-height:1.7}main{max-width:1300px;margin:auto;padding:24px}button,input{font:inherit}button{padding:9px 16px;border:1px solid #7893a5;border-radius:6px;background:white;cursor:pointer}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.notice{border-left:4px solid #c68c2b;padding:12px;background:#fff5dd}#summary{overflow-wrap:anywhere}.layout{display:grid;grid-template-columns:260px 1fr;gap:22px;margin-top:24px}nav{display:flex;flex-direction:column;gap:9px;align-self:start}nav button{text-align:left}nav button.active{background:#dceaf5;border-color:#245e89}article{background:white;padding:24px;border-radius:12px;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;padding:15px;line-height:1.6;font-size:13px}.tag{display:inline-block;border-radius:5px;padding:4px 10px;background:#e7eef5}.passed{color:#0c6650;background:#dcf4e9}.undefined{color:#875517;background:#fff0cc}.failed{color:#9c2735;background:#ffe0e5}.checks{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}#error{color:#a52530}@media(max-width:750px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{flex-shrink:0}}

.flow-stage{border:1px solid #ccdbe5;border-left:4px solid #397499;border-radius:8px;padding:15px;margin:12px 0;overflow-wrap:anywhere}.flow-stage.selected{background:#eaf3fa}.flow-stage.undefined{border-left-color:#be8d35}.flow-arrow{color:#617b8b;margin-left:20px}.flow-stage button{margin-top:8px}button[aria-pressed="true"]{background:#245e89;color:white}.flow-stage pre{max-height:240px;overflow:auto}
</style>
<header><h1>MemAuth · 学术复现工作台</h1><div>原文公式 · 实验配置 · 实际计算产物 · 独立验证</div></header>
<main><div class="toolbar"><label>读取本机实验记录 <input id="file" type="file" accept=".json,application/json"></label><button id="export" disabled>导出当前记录</button></div>
<p class="notice">显式实验配置；注册工件可能关联身份。界面展示导入记录中的后端报告，不执行签发或密码学复验，也不验证文件来源与完整性。未定义步骤不会显示为认证成功。</p>
<p id="error" role="alert"></p><section id="summary"><p>先运行 registration_memory 实验，再选择生成的 JSON 文件。文件只在本机浏览器内读取。</p></section>
<div class="toolbar" role="group" aria-label="展示视图"><button id="calculation" aria-pressed="true">计算视图</button><button id="flow" aria-pressed="false">流程视图</button></div><div class="layout"><nav id="steps" aria-label="算法步骤"></nav><article id="detail"><h2>等待真实计算记录</h2><p>此处将展示来源、公式、实际产物和验证状态。</p></article></div></main>
<script>
let selectedStep=0, view='calculation'; let current=null; const file=document.querySelector('#file'),summary=document.querySelector('#summary'),nav=document.querySelector('#steps'),detail=document.querySelector('#detail'),error=document.querySelector('#error'),exportButton=document.querySelector('#export');
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function showCalculation(index){const step=current.steps[index];detail.replaceChildren(el('span',step.status==='passed'?'计算通过':step.status==='undefined'?'原文未定义 / 未执行':'验证失败','tag '+step.status),el('h2',step.operation),el('p',step.source),el('h3','原文关系 / 实验边界'),el('pre',step.formula),el('h3','实际计算产物'));for(const [name,value] of Object.entries(step.outputs||{})){if(typeof value==='object'&&value!==null){const disclosure=el('details');disclosure.append(el('summary',name+' · 展开编码和完整记录'),el('pre',JSON.stringify(value,null,2)));detail.append(disclosure)}else{detail.append(el('p',name),el('pre',String(value)))}}[...nav.children].forEach((button,i)=>button.classList.toggle('active',i===index))}

// Presentation annotations describe local computation roles, never network messages.
const roleByOperation={'PHCInit / PAConstruct':['TP → AP（本机仿真）','IRF 加密 → RF 同态掩码'],'PHCFinalize':['PA / TP（本机仿真）','PA 公钥 → TP 固定基底签名'],'初始审计记忆':['PA','TP/AP 审计事件 → Seq1/Seq2 → 初始记忆承诺'],'APPEND':['PA','追加事件 → 新 Merkle 根 → 保持 CH 承诺'],'CREATE':['PA','新增宏节点 → 多项式更新 → 新承诺'],'InitSync 见证计算':['PA','当前宏节点坐标 → G2 同步见证（未完成角色同步）'],'open / upd 原语验证':['PA / SA 等式实验','初始同步快照 → 两项配对验证；不推进锚点'],'Bootstrap / 连续认证':['PA / SA（未执行）','原文未决项 → 诊断停止']};
function show(index){selectedStep=index;if(view==='calculation'){showCalculation(index);return}detail.replaceChildren(el('h2','角色与产物流转'),el('p','下列角色说明是本机实验的展示注释，不代表真实网络交付、可信隔离或已完成认证。'));current.steps.forEach((step,i)=>{const stage=el('section',undefined,'flow-stage '+step.status+(i===index?' selected':''));const annotation=roleByOperation[step.operation]||['角色未标注','以计算记录为准'];stage.append(el('span',step.status==='passed'?'后端报告：计算通过':step.status==='undefined'?'未定义 / 未执行':'后端报告：失败','tag '+step.status),el('h3',(i+1)+'. '+step.operation),el('p','角色：'+annotation[0]),el('p',annotation[1]),el('p',step.source));const inspect=el('button','查看此步公式与产物');inspect.onclick=()=>{setView('calculation');show(i)};stage.append(inspect);detail.append(stage);if(i<current.steps.length-1)detail.append(el('div','↓ 本机实验步骤顺序；非认证消息','flow-arrow'))});[...nav.children].forEach((button,i)=>button.classList.toggle('active',i===index))}
roleByOperation['topology 实验校验']=['SA（本机实验注入 PKPA）','完整摘要序列 → Merkle 重建 → CH 开口 → 点打开输入 y；全局公钥可关联'];
roleByOperation['联合追责等式实验']=['TP / AP（本机协作实验）','解盲 → 注册查找 → AP 协作值 → 身份登记匹配；不表示真实审批'];
function setView(value){view=value;document.querySelector('#calculation').setAttribute('aria-pressed',String(value==='calculation'));document.querySelector('#flow').setAttribute('aria-pressed',String(value==='flow'));if(current)show(selectedStep)}
document.querySelector('#calculation').onclick=()=>setView('calculation');
document.querySelector('#flow').onclick=()=>setView('flow');

file.addEventListener('change',async()=>{error.textContent='';current=null;exportButton.disabled=true;nav.replaceChildren();try{if(!file.files[0])return;if(file.files[0].size>4000000)throw Error('文件超过 4 MB 限制');const data=JSON.parse(await file.files[0].text());if(!data.profile||data.profile.profileId!=='memauth-synthetic-sha256-hmac-v1'||!Array.isArray(data.steps)||!data.steps.length||typeof data.checks!=='object'||!data.checks)throw Error('请选择 registration_memory 生成的实验记录');for(const step of data.steps)if(typeof step.operation!=='string'||typeof step.formula!=='string'||!['passed','undefined','failed'].includes(step.status)||typeof step.source!=='string')throw Error('步骤格式不正确');current=data;summary.replaceChildren(el('h2','实验概览'),el('p',data.scope),el('p','配置：'+data.profile.profileId+' · SRS：'+data.srsId),el('p',data.privacy));const checks=el('div',undefined,'checks');for(const [name,value] of Object.entries(data.checks)){if(typeof value!=='boolean')throw Error('验证结果必须为布尔值');checks.append(el('span',(value?'✓ ':'× ')+name,'tag '+(value?'passed':'failed')))}summary.append(checks,el('p','后端总耗时：'+Number(data.elapsedMs).toFixed(0)+' ms（含参数生成）'));data.steps.forEach((step,index)=>{const button=el('button',(index+1)+'. '+step.operation);button.onclick=()=>show(index);nav.append(button)});exportButton.disabled=false;show(0)}catch(e){current=null;nav.replaceChildren();summary.replaceChildren();detail.replaceChildren(el('h2','未加载有效记录'));error.textContent=e.message}});
exportButton.onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='memauth-registration-public-trace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
